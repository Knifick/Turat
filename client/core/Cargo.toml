[package]
name = "turattext-core"
version = "3.4.0"
edition = "2024"
description = "Platform-independent Turat local-first client core"

[lib]
name = "turattext_core"
crate-type = ["cdylib", "rlib"]

[features]
# Обёртка для интеграционных тестов: в обычной сборке её нет.
testing = []

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = "2.2.0"
hex = "0.4.3"
hkdf = "0.12"
hmac = "0.12"
# Снимок данных аккаунта сжимается перед шифрованием: история переписки — в основном текст.
miniz_oxide = "0.8"
ml-kem = "0.2"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8", "pem"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.16"
# Звонки: Opus — эталонный libopus, переведённый на Rust (без C-тулчейна под Android и Windows),
# WebSocket-фолбэк поверх того же rustls/ring, что и у reqwest.
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
unsafe-libopus = "0.2.0"
webpki-roots = "1"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
zeroize = "1.8.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

# Argon2 с 64 МиБ памяти и Opus в отладочной сборке медленнее в десятки раз — тесты ждали бы
# минутами. Зависимости собираются с оптимизацией и в debug: на отладку самого ядра это не влияет.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
